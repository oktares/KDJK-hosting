<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="n8nGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea4b71" />
      <stop offset="100%" stop-color="#ff6d5a" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Grid Pattern Overlay -->
  <g opacity="0.07" stroke="#ffffff" stroke-width="1">
    <path d="M0,40 H1200 M0,80 H1200 M0,120 H1200 M0,160 H1200 M0,200 H1200 M0,240 H1200 M0,280 H1200 M0,320 H1200" />
    <path d="M40,0 V360 M80,0 V360 M120,0 V360 M160,0 V360 M200,0 V360 M240,0 V360 M280,0 V360 M320,0 V360 M360,0 V360 M400,0 V360 M440,0 V360 M480,0 V360 M520,0 V360 M560,0 V360 M600,0 V360 M640,0 V360 M680,0 V360 M720,0 V360 M760,0 V360 M800,0 V360 M840,0 V360 M880,0 V360 M920,0 V360 M960,0 V360 M1000,0 V360 M1040,0 V360 M1080,0 V360 M1120,0 V360 M1160,0 V360" />
  </g>

  <!-- Decorative Ambient Glows -->
  <circle cx="200" cy="80" r="140" fill="#ea4b71" opacity="0.25" filter="url(#glow)" />
  <circle cx="1020" cy="260" r="160" fill="#6366f1" opacity="0.2" filter="url(#glow)" />

  <!-- Header Badge -->
  <rect x="80" y="45" width="235" height="32" rx="16" fill="#ea4b71" fill-opacity="0.2" stroke="#ea4b71" stroke-width="1" />
  <circle cx="98" cy="61" r="5" fill="#ea4b71" />
  <text x="114" y="66" fill="#ff8da1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" letter-spacing="0.5">SELF-HOSTED GUIDE 2026</text>

  <!-- Title -->
  <text x="80" y="135" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" letter-spacing="-1">
    Panduan Self-Hosted <tspan fill="url(#n8nGrad)">n8n</tspan> di VPS
  </text>

  <!-- Subtitle -->
  <text x="80" y="180" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400">
    Deploy n8n Workflow Automation Engine dengan Docker, PostgreSQL 16 &amp; Caddy Auto-SSL
  </text>

  <!-- Feature Pills -->
  <g transform="translate(80, 220)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="165" height="42" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
    <text x="20" y="26" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="600">⚡ Zero-Limits Tasks</text>

    <!-- Pill 2 -->
    <rect x="180" y="0" width="170" height="42" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
    <text x="200" y="26" fill="#a855f7" font-family="sans-serif" font-size="14" font-weight="600">🔒 100% Data Privacy</text>

    <!-- Pill 3 -->
    <rect x="365" y="0" width="165" height="42" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
    <text x="385" y="26" fill="#4ade80" font-family="sans-serif" font-size="14" font-weight="600">🛡️ Auto SSL HTTPS</text>

    <!-- Pill 4 -->
    <rect x="545" y="0" width="160" height="42" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
    <text x="565" y="26" fill="#f59e0b" font-family="sans-serif" font-size="14" font-weight="600">🤖 Built-in AI Agents</text>
  </g>

  <!-- Node Illustration on the Right -->
  <g transform="translate(860, 50)">
    <!-- Connection lines -->
    <path d="M 60 70 C 130 70, 110 160, 180 160" fill="none" stroke="#ea4b71" stroke-width="3" stroke-dasharray="6,4" />
    <path d="M 60 190 C 120 190, 120 160, 180 160" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="6,4" />
    <path d="M 180 160 C 230 160, 220 110, 260 110" fill="none" stroke="#4ade80" stroke-width="3" />

    <!-- Node 1: Webhook -->
    <rect x="10" y="45" width="100" height="50" rx="10" fill="#1e293b" stroke="#ea4b71" stroke-width="2" />
    <text x="60" y="75" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Webhook</text>

    <!-- Node 2: DB -->
    <rect x="10" y="165" width="100" height="50" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
    <text x="60" y="195" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">PostgreSQL</text>

    <!-- Node 3: AI Node -->
    <rect x="130" y="135" width="100" height="50" rx="10" fill="#1e293b" stroke="#a855f7" stroke-width="2" />
    <text x="180" y="165" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">AI Agent</text>

    <!-- Node 4: Telegram -->
    <rect x="220" y="85" width="100" height="50" rx="10" fill="#1e293b" stroke="#4ade80" stroke-width="2" />
    <text x="270" y="115" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Telegram</text>
  </g>
</svg>
