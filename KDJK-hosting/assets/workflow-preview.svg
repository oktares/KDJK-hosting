    <text x="15" y="85" fill="#cbd5e1" font-family="sans-serif" font-size="11">ID: LEAD-482910</text>
    <text x="15" y="112" fill="#4ade80" font-family="sans-serif" font-size="10">✓ 1 Row Inserted (2ms)</text>
