<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="caddyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="n8nGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea4b71" />
      <stop offset="100%" stop-color="#ff758f" />
    </linearGradient>
    <linearGradient id="pgGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#336791" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <rect width="1000" height="620" rx="16" fill="url(#bg2)" />

  <!-- Diagram Title -->
  <text x="50" y="55" fill="#f8fafc" font-family="sans-serif" font-size="22" font-weight="700">Arsitektur n8n Self-Hosted di Linux VPS</text>
  <text x="50" y="80" fill="#94a3b8" font-family="sans-serif" font-size="14">Aliran traffic aman dari Public Internet melalui Caddy Reverse Proxy &amp; Docker Isolated Bridge Network</text>

  <!-- Left: Public Internet / User Client -->
  <g transform="translate(50, 150)" filter="url(#shadow)">
    <rect width="180" height="380" rx="12" fill="url(#boxGrad)" stroke="#334155" stroke-width="1.5" />
    <text x="90" y="40" fill="#e2e8f0" font-family="sans-serif" font-size="16" font-weight="700" text-anchor="middle">Internet / Users</text>
    <line x1="20" y1="55" x2="160" y2="55" stroke="#334155" stroke-width="1" />

    <!-- User Browser -->
    <rect x="20" y="80" width="140" height="65" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="90" y="110" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle">🌐 Web Browser</text>
    <text x="90" y="130" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Dashboard / Canvas</text>

    <!-- Webhook Source -->
    <rect x="20" y="170" width="140" height="65" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="90" y="200" fill="#f43f5e" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle">⚡ Webhook Clients</text>
    <text x="90" y="220" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Form / Stripe / GitHub</text>

    <!-- Cloudflare DNS -->
    <rect x="20" y="260" width="140" height="75" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1" />
    <text x="90" y="290" fill="#fbbf24" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle">☁️ Cloudflare / DNS</text>
    <text x="90" y="310" fill="#cbd5e1" font-family="sans-serif" font-size="11" text-anchor="middle">A Record: n8n.domain</text>
    <text x="90" y="325" fill="#64748b" font-family="sans-serif" font-size="10" text-anchor="middle">SSL &amp; DDoS Protection</text>
  </g>

  <!-- Big Box: Linux VPS -->
  <g transform="translate(290, 120)" filter="url(#shadow)">
    <rect width="660" height="450" rx="14" fill="#0f172a" stroke="#3b82f6" stroke-width="2" stroke-dasharray="6,4" />
    <text x="25" y="35" fill="#60a5fa" font-family="sans-serif" font-size="15" font-weight="700">🖥️ Linux VPS (Ubuntu 22.04 / 24.04 LTS) — Firewall UFW Active</text>

    <!-- Port indicator -->
    <rect x="520" y="18" width="120" height="26" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="580" y="35" fill="#4ade80" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">Ports: 80 / 443</text>

    <!-- Docker Network Boundary -->
    <rect x="25" y="60" width="610" height="365" rx="10" fill="#131d31" stroke="#334155" stroke-width="1.5" />
    <text x="45" y="85" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="600">🐳 Docker Internal Bridge Network (n8n_network)</text>

    <!-- Container 1: Caddy -->
    <g transform="translate(45, 110)">
      <rect width="160" height="280" rx="10" fill="url(#boxGrad)" stroke="#0284c7" stroke-width="2" />
      <rect width="160" height="35" rx="10" fill="url(#caddyGrad)" />
      <text x="80" y="23" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">CADDY REVERSE PROXY</text>
      
      <text x="15" y="70" fill="#e2e8f0" font-family="sans-serif" font-size="11" font-weight="600">Fungsi Utama:</text>
      <text x="15" y="95" fill="#94a3b8" font-family="sans-serif" font-size="11">• Auto Let's Encrypt</text>
      <text x="15" y="115" fill="#94a3b8" font-family="sans-serif" font-size="11">• HTTP -> HTTPS</text>
      <text x="15" y="135" fill="#94a3b8" font-family="sans-serif" font-size="11">• WebSocket Flush</text>
      <text x="15" y="155" fill="#94a3b8" font-family="sans-serif" font-size="11">• Gzip &amp; Zstd</text>
      <text x="15" y="175" fill="#94a3b8" font-family="sans-serif" font-size="11">• Security Headers</text>

      <rect x="15" y="215" width="130" height="45" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="80" y="235" fill="#38bdf8" font-family="sans-serif" font-size="10" text-anchor="middle">caddy_data (SSL)</text>
      <text x="80" y="250" fill="#64748b" font-family="sans-serif" font-size="10" text-anchor="middle">Docker Volume</text>
    </g>

    <!-- Container 2: n8n Core -->
    <g transform="translate(250, 110)">
      <rect width="180" height="280" rx="10" fill="url(#boxGrad)" stroke="#ea4b71" stroke-width="2" />
      <rect width="180" height="35" rx="10" fill="url(#n8nGrad2)" />
      <text x="90" y="23" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">n8n WORKFLOW ENGINE</text>
      
      <text x="15" y="65" fill="#e2e8f0" font-family="sans-serif" font-size="11" font-weight="600">Port Internal: 5678</text>
      <text x="15" y="90" fill="#94a3b8" font-family="sans-serif" font-size="11">• Canvas UI Server</text>
      <text x="15" y="110" fill="#94a3b8" font-family="sans-serif" font-size="11">• Webhook Listener</text>
      <text x="15" y="130" fill="#94a3b8" font-family="sans-serif" font-size="11">• Node.js / Python Runtime</text>
      <text x="15" y="150" fill="#94a3b8" font-family="sans-serif" font-size="11">• AI Agent Framework</text>
      <text x="15" y="170" fill="#94a3b8" font-family="sans-serif" font-size="11">• Auto Data Pruning</text>

      <rect x="15" y="215" width="150" height="45" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="90" y="235" fill="#f43f5e" font-family="sans-serif" font-size="10" text-anchor="middle">n8n_data (Keys/Files)</text>
      <text x="90" y="250" fill="#64748b" font-family="sans-serif" font-size="10" text-anchor="middle">Docker Volume</text>
    </g>

    <!-- Container 3: PostgreSQL 16 -->
    <g transform="translate(470, 110)">
      <rect width="150" height="280" rx="10" fill="url(#boxGrad)" stroke="#336791" stroke-width="2" />
      <rect width="150" height="35" rx="10" fill="url(#pgGrad)" />
      <text x="75" y="23" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">POSTGRESQL 16</text>
      
      <text x="15" y="65" fill="#e2e8f0" font-family="sans-serif" font-size="11" font-weight="600">Port Internal: 5432</text>
      <text x="15" y="90" fill="#94a3b8" font-family="sans-serif" font-size="11">• Production Storage</text>
      <text x="15" y="110" fill="#94a3b8" font-family="sans-serif" font-size="11">• Workflow Schemas</text>
      <text x="15" y="130" fill="#94a3b8" font-family="sans-serif" font-size="11">• Execution Logs</text>
      <text x="15" y="150" fill="#94a3b8" font-family="sans-serif" font-size="11">• Credentials Store</text>

      <rect x="15" y="215" width="120" height="45" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="75" y="235" fill="#60a5fa" font-family="sans-serif" font-size="10" text-anchor="middle">postgres_data</text>
      <text x="75" y="250" fill="#64748b" font-family="sans-serif" font-size="10" text-anchor="middle">Persistent Volume</text>
    </g>

    <!-- Connection arrows inside VPS -->
    <path d="M 205 250 L 250 250" fill="none" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)" />
    <path d="M 430 250 L 470 250" fill="none" stroke="#60a5fa" stroke-width="2.5" />
  </g>

  <!-- Connect internet to VPS -->
  <path d="M 230 330 L 290 330" fill="none" stroke="#4ade80" stroke-width="3" stroke-dasharray="4,4" />
  <text x="260" y="320" fill="#4ade80" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">HTTPS</text>
</svg>
