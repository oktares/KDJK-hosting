<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" width="100%" height="100%">
  <defs>
    <linearGradient id="uiDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141923" />
      <stop offset="100%" stop-color="#0b0e14" />
    </linearGradient>
    <linearGradient id="activeRow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea4b71" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ea4b71" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <!-- App Window Frame -->
  <rect width="1100" height="580" rx="12" fill="url(#uiDark)" stroke="#2d3748" stroke-width="1.5" />

  <!-- Top Window Header Bar -->
  <rect width="1100" height="42" fill="#1a202c" rx="12" />
  <rect y="30" width="1100" height="12" fill="#1a202c" /> <!-- Flat bottom for header -->
  <circle cx="20" cy="21" r="5.5" fill="#ef4444" />
  <circle cx="38" cy="21" r="5.5" fill="#f59e0b" />
  <circle cx="56" cy="21" r="5.5" fill="#10b981" />
  
  <!-- Browser Address URL Mockup -->
  <rect x="300" y="8" width="500" height="26" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="320" y="25" fill="#10b981" font-family="sans-serif" font-size="11">🔒 https://</text>
  <text x="375" y="25" fill="#f1f5f9" font-family="sans-serif" font-size="11" font-weight="600">n8n.domainanda.com</text>
  <text x="510" y="25" fill="#64748b" font-family="sans-serif" font-size="11">/workflows</text>

  <!-- Left Sidebar (60px icon bar + 180px text) -->
  <rect x="0" y="42" width="220" height="538" fill="#111827" stroke="#1f2937" stroke-width="1" />
  
  <!-- Logo -->
  <g transform="translate(20, 60)">
    <rect width="30" height="30" rx="6" fill="#ea4b71" />
    <text x="15" y="21" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">n</text>
    <text x="40" y="22" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="700">n8n.io</text>
  </g>

  <!-- Sidebar Nav Items -->
  <g transform="translate(15, 120)">
    <!-- Item 1: Workflows (Active) -->
    <rect x="0" y="0" width="190" height="36" rx="6" fill="#1f2937" />
    <text x="15" y="23" fill="#ea4b71" font-family="sans-serif" font-size="13" font-weight="700">⚡ Workflows</text>
    <rect x="150" y="8" width="28" height="20" rx="10" fill="#ea4b71" />
    <text x="164" y="22" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">12</text>

    <!-- Item 2: Executions -->
    <text x="15" y="65" fill="#9ca3af" font-family="sans-serif" font-size="13">📊 Executions</text>
    
    <!-- Item 3: Credentials -->
    <text x="15" y="105" fill="#9ca3af" font-family="sans-serif" font-size="13">🔑 Credentials</text>
    
    <!-- Item 4: Variables -->
    <text x="15" y="145" fill="#9ca3af" font-family="sans-serif" font-size="13">⚙️ Variables</text>

    <!-- Item 5: Community Nodes -->
    <text x="15" y="185" fill="#9ca3af" font-family="sans-serif" font-size="13">🧩 Community Nodes</text>

    <!-- Item 6: Settings -->
    <text x="15" y="225" fill="#9ca3af" font-family="sans-serif" font-size="13">🛠️ Admin Settings</text>
  </g>

  <!-- Main Content Area -->
  <g transform="translate(245, 65)">
    <!-- Dashboard Top Bar -->
    <text x="0" y="25" fill="#f9fafb" font-family="sans-serif" font-size="20" font-weight="700">Workflow Repository</text>
    <rect x="680" y="2" width="150" height="34" rx="6" fill="#ea4b71" />
    <text x="755" y="24" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle">+ Add Workflow</text>

    <!-- Stats Quick Cards -->
    <g transform="translate(0, 45)">
      <!-- Card 1 -->
      <rect x="0" y="0" width="195" height="70" rx="8" fill="#1f2937" stroke="#374151" stroke-width="1" />
      <text x="15" y="24" fill="#9ca3af" font-family="sans-serif" font-size="11">TOTAL RUNS (30D)</text>
      <text x="15" y="52" fill="#38bdf8" font-family="sans-serif" font-size="22" font-weight="bold">142,890</text>

      <!-- Card 2 -->
      <rect x="210" y="0" width="195" height="70" rx="8" fill="#1f2937" stroke="#374151" stroke-width="1" />
      <text x="225" y="24" fill="#9ca3af" font-family="sans-serif" font-size="11">SUCCESS RATE</text>
      <text x="225" y="52" fill="#4ade80" font-family="sans-serif" font-size="22" font-weight="bold">99.82%</text>

      <!-- Card 3 -->
      <rect x="420" y="0" width="195" height="70" rx="8" fill="#1f2937" stroke="#374151" stroke-width="1" />
      <text x="435" y="24" fill="#9ca3af" font-family="sans-serif" font-size="11">ACTIVE TRIGGERS</text>
      <text x="435" y="52" fill="#f59e0b" font-family="sans-serif" font-size="22" font-weight="bold">8 Webhooks</text>

      <!-- Card 4 -->
      <rect x="630" y="0" width="195" height="70" rx="8" fill="#1f2937" stroke="#374151" stroke-width="1" />
      <text x="645" y="24" fill="#9ca3af" font-family="sans-serif" font-size="11">ESTIMATED SAVINGS</text>
      <text x="645" y="52" fill="#a855f7" font-family="sans-serif" font-size="22" font-weight="bold">$490 / bln</text>
    </g>

    <!-- Workflows Table -->
    <g transform="translate(0, 135)">
      <!-- Table Header -->
      <rect x="0" y="0" width="830" height="36" rx="6" fill="#111827" />
      <text x="20" y="22" fill="#9ca3af" font-family="sans-serif" font-size="11" font-weight="bold">WORKFLOW NAME</text>
      <text x="340" y="22" fill="#9ca3af" font-family="sans-serif" font-size="11" font-weight="bold">TRIGGER</text>
      <text x="480" y="22" fill="#9ca3af" font-family="sans-serif" font-size="11" font-weight="bold">LAST RUN</text>
      <text x="620" y="22" fill="#9ca3af" font-family="sans-serif" font-size="11" font-weight="bold">STATUS</text>
      <text x="740" y="22" fill="#9ca3af" font-family="sans-serif" font-size="11" font-weight="bold">ACTION</text>

      <!-- Row 1: AI Lead Triage -->
      <rect x="0" y="42" width="830" height="50" rx="6" fill="url(#activeRow)" stroke="#374151" stroke-width="1" />
      <text x="20" y="72" fill="#f3f4f6" font-family="sans-serif" font-size="13" font-weight="600">🤖 AI Lead Triage &amp; Telegram Alert</text>
      <text x="340" y="72" fill="#38bdf8" font-family="sans-serif" font-size="12">Webhook POST</text>
      <text x="480" y="72" fill="#9ca3af" font-family="sans-serif" font-size="12">2 mins ago</text>
      <rect x="620" y="56" width="70" height="22" rx="11" fill="#10b981" fill-opacity="0.2" />
      <text x="655" y="71" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">ACTIVE</text>
      <text x="760" y="72" fill="#60a5fa" font-family="sans-serif" font-size="12">Open ➔</text>

      <!-- Row 2: Daily Backup -->
      <rect x="0" y="98" width="830" height="50" rx="6" fill="#1f2937" stroke="#374151" stroke-width="1" />
      <text x="20" y="128" fill="#f3f4f6" font-family="sans-serif" font-size="13" font-weight="600">💾 Daily Database Backup &amp; S3 Sync</text>
      <text x="340" y="128" fill="#f59e0b" font-family="sans-serif" font-size="12">Cron (02:00 WIB)</text>
      <text x="480" y="128" fill="#9ca3af" font-family="sans-serif" font-size="12">9 hours ago</text>
      <rect x="620" y="112" width="70" height="22" rx="11" fill="#10b981" fill-opacity="0.2" />
      <text x="655" y="127" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">ACTIVE</text>
      <text x="760" y="128" fill="#60a5fa" font-family="sans-serif" font-size="12">Open ➔</text>

      <!-- Row 3: Stripe to Invoice -->
      <rect x="0" y="154" width="830" height="50" rx="6" fill="#1f2937" stroke="#374151" stroke-width="1" />
      <text x="20" y="184" fill="#f3f4f6" font-family="sans-serif" font-size="13" font-weight="600">💳 Payment Webhook to Invoice Generator</text>
      <text x="340" y="184" fill="#38bdf8" font-family="sans-serif" font-size="12">Stripe Event</text>
      <text x="480" y="184" fill="#9ca3af" font-family="sans-serif" font-size="12">Yesterday</text>
      <rect x="620" y="168" width="70" height="22" rx="11" fill="#10b981" fill-opacity="0.2" />
      <text x="655" y="183" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">ACTIVE</text>
      <text x="760" y="184" fill="#60a5fa" font-family="sans-serif" font-size="12">Open ➔</text>

      <!-- Row 4: Notion Sync -->
      <rect x="0" y="210" width="830" height="50" rx="6" fill="#1f2937" stroke="#374151" stroke-width="1" />
      <text x="20" y="240" fill="#f3f4f6" font-family="sans-serif" font-size="13" font-weight="600">📝 Notion CRM Bi-directional Sync</text>
      <text x="340" y="240" fill="#a855f7" font-family="sans-serif" font-size="12">Polling 15m</text>
      <text x="480" y="240" fill="#9ca3af" font-family="sans-serif" font-size="12">14 mins ago</text>
      <rect x="620" y="224" width="70" height="22" rx="11" fill="#6b7280" fill-opacity="0.3" />
      <text x="655" y="239" fill="#9ca3af" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">PAUSED</text>
      <text x="760" y="240" fill="#60a5fa" font-family="sans-serif" font-size="12">Open ➔</text>
    </g>
  </g>
</svg>
